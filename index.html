<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직 물품 계산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="header-container">
        <h1>🧮 조직 물품 계산기</h1>
        <a href="ledger.html" class="nav-btn">📖 조직 장부 작성</a>
    </div>

    <div class="container">
        <!-- 물품 선택 및 수량 입력 카드가 들어가는 영역 -->
        <div id="items-container" class="grid-container"></div>

        <!-- 최종 정산 결과 카드 -->
        <div class="card full-width">
            <h2>💰 최종 정산 금액</h2>
            
            <div id="summary-list" class="summary-list">
                <p style="color: var(--text-muted); text-align: center;">선택된 물품이 없습니다.</p>
            </div>

            <div class="total-box">
                <span>총합계:</span>
                <span id="grand-total">0원</span>
            </div>

            <div class="copy-box">
                <textarea id="copy-text" readonly rows="4" class="styled-textarea" placeholder="선택한 물품 내역이 이곳에 표시됩니다."></textarea>
                <button class="copy-btn" onclick="copyResult()">📋 내역 복사하기</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
