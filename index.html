<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="조직 물품 계산기 - 마약, 무기, 가방, 창고 구매 금액을 빠르게 계산하세요.">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>조직 물품 계산기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- defer: 렌더링을 막지 않고 순서대로 실행 (common.js → script.js) -->
    <script src="common.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <header class="header-container has-total">
        <div class="header-title">
            <h1>🧮 조직 물품 계산기</h1>
            <div class="header-total" role="status" aria-live="polite">
                <span class="header-total-label">총합계</span>
                <span id="header-total" class="header-total-value">0원</span>
            </div>
            <div id="header-settle" class="header-total header-settle" role="status" aria-live="polite" hidden></div>
        </div>
        <a href="ledger.html" class="nav-btn">📖 조직 장부 작성</a>
    </header>

    <main class="container">
        <!-- JS에서 카드가 동적으로 생성될 영역 -->
        <div id="items-container" class="grid-container"></div>

        <!-- 하단 최종 정산 금액 카드 -->
        <div class="card summary-card">
            <div class="summary-header">
                <h2>💰 최종 정산 금액</h2>
                <button type="button" id="btn-reset-all" class="reset-btn" title="전체 수량 초기화">🔄 초기화</button>
            </div>

            <div id="summary-list" class="summary-list">
                <p class="empty-msg">선택된 물품이 없습니다.</p>
            </div>

            <div class="summary-footer">
                <div class="total-row">
                    <span class="total-label">총합계</span>
                    <span id="grand-total" class="total-value">0원</span>
                </div>

                <div class="copy-box">
                    <textarea id="copy-text" class="styled-textarea" rows="4" readonly
                        placeholder="선택한 물품 내역이 이곳에 표시됩니다."></textarea>
                    <button type="button" id="btn-copy-result" class="copy-btn-sm">📋 내역 복사하기</button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
